# Blueprint de Render para el API. La base de datos PostgreSQL vive en Neon (plan gratuito).
services:
  - type: web
    name: brackit-api
    runtime: docker
    rootDir: backend
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # jdbc:postgresql://<host>.neon.tech/<base>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://brackit.dcodea-correo.workers.dev,https://brackit.pages.dev,https://duangomez.github.io
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_SIMULATOR
        value: "true"
